<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- DNA ladder horizontal rungs -->
  <line x1="6" y1="8" x2="26" y2="8" stroke="#17a2b8" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <line x1="9" y1="14" x2="23" y2="14" stroke="#007bff" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <line x1="9" y1="20" x2="23" y2="20" stroke="#17a2b8" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <line x1="6" y1="26" x2="26" y2="26" stroke="#007bff" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  
  <!-- Helix Strand 1 (Sine wave) -->
  <path d="M 6,8 C 12,8 14,26 20,26 C 26,26 26,8 26,8" fill="none" stroke="#007bff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Helix Strand 2 (Cosine wave / opposite phase) -->
  <path d="M 26,8 C 20,8 18,26 12,26 C 6,26 6,8 6,8" fill="none" stroke="#17a2b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Nucleotide nodes -->
  <circle cx="6" cy="8" r="3" fill="#007bff" />
  <circle cx="26" cy="8" r="3" fill="#17a2b8" />
  <circle cx="12" cy="14" r="2.5" fill="#007bff" />
  <circle cx="20" cy="14" r="2.5" fill="#17a2b8" />
  <circle cx="12" cy="20" r="2.5" fill="#17a2b8" />
  <circle cx="20" cy="20" r="2.5" fill="#007bff" />
  <circle cx="6" cy="26" r="3" fill="#17a2b8" />
  <circle cx="26" cy="26" r="3" fill="#007bff" />
</svg>
